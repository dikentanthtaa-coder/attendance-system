<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2f4f">
<title>No internet - Gyansatr Attendance</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #f3f6fa; color: #15212e; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; text-align: center; }
  main { max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 16px 0 8px; font-size: 22px; }
  p { color: #52606e; }
  button { margin-top: 24px; width: 100%; min-height: 52px; border: 0; border-radius: 10px; background: #1c5a96; color: #fff; font: 600 16px ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>No internet connection</h1>
  <p>Attendance needs the internet so every device stays in step. Nothing has been lost. Connect, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  // Phones don't always announce that the internet is back, so this also keeps checking by itself.
  function check() {
    fetch("/login", { method: "HEAD", cache: "no-store" }).then(function () { location.reload(); }, function () {});
  }
  addEventListener("online", check);
  setInterval(check, 3000);
</script>
</body>
</html>
